name: Gerar IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Embutir three.js
        run: sh embutir-three.sh
      - name: Instalar dependencias
        run: npm install
      - name: Preparar www
        run: |
          mkdir -p www tmp
          unzip -q floresta-app.zip -d tmp
          F=$(find tmp -name index.html -not -path '*/__MACOSX/*' | head -n 1)
          [ -n "$F" ] || { echo "index.html nao encontrado"; ls -R tmp; exit 1; }
          cp -R "$(dirname "$F")"/. www/
      - name: Criar projeto iOS
        run: |
          npx cap add ios || true
          npx cap sync ios
      - name: Compilar sem assinatura
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath $PWD/build/App.xcarchive archive CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""
      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r FlorestaViva.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FlorestaViva-ipa
          path: FlorestaViva.ipa
